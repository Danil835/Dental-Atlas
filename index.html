<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Атлас стоматолога</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Sora:wght@500;600;700&display=swap">
<style>
/* layout: top bar, then two columns (instrument list | 3D stage + notes); test mode swaps the main area */
:root{
  --bg:#edf2f3; --surface:#ffffff; --ink:#0f2329; --ink2:#4b616a; --line:#d3dde0;
  --accent:#0a7c78; --accent-ink:#ffffff; --accent-soft:#d8efed;
  --good:#1c8a4f; --good-soft:#d9f0e3; --bad:#c23b32; --bad-soft:#f8dddb;
  --stage1:#2a3d46; --stage2:#0f1b21; --stage-ink:#d6e4e8;
  --f-head:'Sora',system-ui,sans-serif; --f-body:'Inter',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1519; --surface:#142126; --ink:#e4eff1; --ink2:#93aab1; --line:#27393f;
  --accent:#43c2bb; --accent-ink:#06201e; --accent-soft:#16373a;
  --good:#52c98a; --good-soft:#133425; --bad:#f08077; --bad-soft:#3d1e1d;
  --stage1:#2f444d; --stage2:#0a1317; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1519; --surface:#142126; --ink:#e4eff1; --ink2:#93aab1; --line:#27393f;
  --accent:#43c2bb; --accent-ink:#06201e; --accent-soft:#16373a;
  --good:#52c98a; --good-soft:#133425; --bad:#f08077; --bad-soft:#3d1e1d;
  --stage1:#2f444d; --stage2:#0a1317; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);padding-block:0 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1280px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:18px 0 14px}
.brand{display:flex;align-items:baseline;gap:12px;flex:1 1 260px;min-width:0}
.brand h1{font:700 22px/1.1 var(--f-head);margin:0;letter-spacing:-.01em}
.brand small{font:400 12px var(--f-mono);color:var(--ink2)}
.tabs,.lang{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.tabs button,.lang button{border:0;background:none;padding:8px 16px;border-radius:7px;font-weight:600;color:var(--ink2)}
.lang button{padding:8px 11px;font:500 12px var(--f-mono)}
.tabs button[aria-pressed="true"],.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.view{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.side{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;position:sticky;top:12px;display:flex;flex-direction:column;gap:12px;min-width:0}
.side input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
#list{list-style:none;margin:0;padding:0;max-height:calc(100vh - 290px);min-height:200px;overflow:auto;display:flex;flex-direction:column;gap:2px}
#list button{width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;display:flex;gap:8px;align-items:center;font-size:14px}
#list button:hover{background:var(--bg)}
#list button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
#list .dot{flex:none;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line)}
#list .done .dot{background:var(--good);border-color:var(--good)}
.prog{font:12px var(--f-mono);color:var(--ink2)}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.stagewrap{position:relative}
.stage{position:relative;height:clamp(320px,56vh,560px);border-radius:14px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,var(--stage1),var(--stage2) 78%);touch-action:none;cursor:grab}
.stage:active{cursor:grabbing}
.stage canvas{display:block;width:100%;height:100%}
.tools{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.tools button{background:rgba(10,20,24,.62);color:var(--stage-ink);border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:6px 10px;font:500 12px var(--f-mono);backdrop-filter:blur(6px)}
.tools button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hint{position:absolute;left:12px;bottom:12px;font:12px var(--f-mono);color:var(--stage-ink);opacity:.7;pointer-events:none;max-width:55%}
.stagelabel{position:absolute;left:14px;top:12px;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--stage-ink);opacity:.75}
.fail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--stage-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between}
.head h2{font:700 26px/1.2 var(--f-head);margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
.en{font:12.5px var(--f-mono);color:var(--ink2)}
.tag{display:inline-block;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:5px;margin-bottom:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn:disabled{opacity:.45;cursor:default}
.sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px;margin-top:16px}
.sections section{min-width:0}
.sections .wide{grid-column:1/-1}
.sections h3{font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
.sections p{margin:0;max-width:68ch}
.sections ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:68ch}
.example{background:var(--accent-soft);border-radius:10px;padding:12px 14px}
.nav{display:flex;justify-content:space-between;gap:10px}
/* test */
.testbox{grid-column:1/-1;display:flex;flex-direction:column;gap:16px}
.setup{max-width:640px;display:flex;flex-direction:column;gap:18px}
.setup h2{font:700 24px var(--f-head);margin:0}
.setup label.lbl{font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);display:block;margin-bottom:8px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;font:13px var(--f-mono);color:var(--ink2)}
.qgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;font-weight:500;display:flex;gap:10px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font:500 12px var(--f-mono);color:var(--ink2);border:1px solid var(--line);border-radius:5px;width:22px;height:22px;display:grid;place-items:center;flex:none}
.opt.good{background:var(--good-soft);border-color:var(--good)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{border-radius:10px;padding:12px 14px;margin-top:14px}
.fb.good{background:var(--good-soft)}.fb.bad{background:var(--bad-soft)}
.score{font:700 54px/1 var(--f-head)}
.wrong{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.wrong li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:6px 0;font-size:14px}
.foot{margin-top:28px;font-size:12.5px;color:var(--ink2);max-width:80ch}
@media (max-width:920px){
  .view{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  #list{max-height:200px;min-height:0}
  .qgrid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .sections{grid-template-columns:minmax(0,1fr)}
  .brand small{display:none}
  .head h2{font-size:22px}
  .card{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1 id="ttl"></h1><small id="sub"></small></div>
    <nav class="tabs" id="tabs"><button data-v="learn"></button><button data-v="test"></button></nav>
    <div class="lang" id="lang"><button data-l="ru">RU</button><button data-l="uk">UA</button></div>
  </header>

  <main id="learn" class="view">
    <aside class="side">
      <input id="q" type="search" autocomplete="off">
      <div class="chips" id="cats"></div>
      <div><div class="prog" id="prog"></div><div class="bar"><i id="progbar"></i></div></div>
      <ul id="list"></ul>
    </aside>
    <section class="main">
      <div class="stagewrap"><div class="stage" id="stageL"></div></div>
      <article class="card" id="info"></article>
    </section>
  </main>

  <main id="test" class="view" hidden>
    <div class="testbox" id="testbox"></div>
  </main>

  <p class="foot" id="foot"></p>
</div>
<script src="three.min.js"></script>
<script>
window.D=window.D||[];
window.CATS={
dg:{ru:'Диагностика',uk:'Діагностика'},
th:{ru:'Терапия (ручные)',uk:'Терапія (ручні)'},
en:{ru:'Эндодонтия',uk:'Ендодонтія'},
rt:{ru:'Наконечники, боры, свет',uk:'Наконечники, бори, світло'},
hg:{ru:'Гигиена и изоляция',uk:'Гігієна та ізоляція'},
sg:{ru:'Анестезия и хирургия',uk:'Анестезія та хірургія'},
pr:{ru:'Ортопедия',uk:'Ортопедія'}
};
D.push(
{id:'mirror',cat:'dg',en:'Mouth mirror',
ru:{n:'Стоматологическое зеркало',
o:'Зеркало на ручке с плоской или увеличивающей отражающей поверхностью. Позволяет осмотреть труднодоступные поверхности зубов, отвести щёку или язык и направить свет в рот.',
i:['Держите ручку как перо, упор делайте безымянным пальцем на соседних зубах.','Введите зеркало в рот и боковой поверхностью отведите щёку или язык.','Наклоните отражающую поверхность так, чтобы увидеть нужную область (непрямое зрение).','Если головка запотела, слегка коснитесь ею слизистой щеки или обдуйте воздухом. После работы обработайте по протоколу стерилизации.'],
e:'Врач осматривает нёбную поверхность верхнего моляра, которую невозможно увидеть напрямую. Он отводит щёку и рассматривает отражение при хорошем освещении.'},
uk:{n:'Стоматологічне дзеркало',
o:'Дзеркало на ручці з пласкою або збільшувальною відбивною поверхнею. Дає змогу оглянути важкодоступні поверхні зубів, відвести щоку чи язик і спрямувати світло в рот.',
i:['Тримайте ручку як перо, упор робіть безіменним пальцем на сусідніх зубах.','Введіть дзеркало в рот і боковою поверхнею відведіть щоку або язик.','Нахиліть відбивну поверхню так, щоб побачити потрібну ділянку (непрямий зір).','Якщо голівка запотіла, злегка торкніться нею слизової щоки або обдуйте повітрям. Після роботи обробіть за протоколом стерилізації.'],
e:'Лікар оглядає піднебінну поверхню верхнього моляра, яку неможливо побачити напряму. Він відводить щоку та розглядає відображення при гарному освітленні.'}},

{id:'explorer',cat:'dg',en:'Dental explorer',
ru:{n:'Зонд стоматологический (угловой)',
o:'Тонкий заострённый инструмент с изогнутым концом. Служит для выявления кариозных полостей, шероховатостей эмали, нависающих краёв пломб и поддесневого камня.',
i:['Держите модифицированным перьевым хватом с упором на соседний зуб.','Проведите кончиком по поверхности зуба или по краю пломбы с лёгким давлением, не прокалывая эмаль.','Оцените ощущение: зацепление в фиссуре, шероховатость, размягчение.','Не давите с силой при подозрении на начальный кариес: можно повредить поверхностный слой эмали.'],
e:'При осмотре жевательной поверхности нижнего моляра врач чувствует, что кончик инструмента «застревает» в фиссуре, и подозревает кариес.'},
uk:{n:'Зонд стоматологічний (кутовий)',
o:'Тонкий загострений інструмент із зігнутим кінцем. Слугує для виявлення каріозних порожнин, шорсткостей емалі, нависаючих країв пломб та піддясеневого каменю.',
i:['Тримайте модифікованим пером-хватом з упором на сусідній зуб.','Проведіть кінчиком по поверхні зуба чи по краю пломби з легким тиском, не проколюючи емаль.','Оцініть відчуття: зачеплення у фісурі, шорсткість, розм’якшення.','Не тисніть із силою при підозрі на початковий карієс: можна пошкодити поверхневий шар емалі.'],
e:'Під час огляду жувальної поверхні нижнього моляра лікар відчуває, що кінчик інструмента «застрягає» у фісурі, і підозрює карієс.'}},

{id:'tweezers',cat:'dg',en:'Dental tweezers (college pliers)',
ru:{n:'Пинцет стоматологический',
o:'Пинцет с изогнутым под углом рабочим концом. Используется для переноса ватных валиков, тампонов, турунд, артикуляционной бумаги и мелких материалов в полость рта и обратно.',
i:['Берите двумя пальцами, как карандаш, не сжимая слишком сильно.','Захватите нужный материал кончиками браншей.','Поднесите к рабочей зоне, не касаясь слизистой и языка пациента.','Положите материал на место и положите пинцет на стерильный лоток, а не на стол.'],
e:'Врач заготовил ватные валики и теперь должен поместить их по обе стороны от нижних зубов для изоляции от слюны, не касаясь руками.'},
uk:{n:'Пінцет стоматологічний',
o:'Пінцет із зігнутим під кутом робочим кінцем. Використовується для переносу ватних валиків, тампонів, турунд, артикуляційного паперу та дрібних матеріалів у порожнину рота і назад.',
i:['Беріть двома пальцями, як олівець, не стискаючи занадто сильно.','Захопіть потрібний матеріал кінчиками браншів.','Піднесіть до робочої зони, не торкаючись слизової та язика пацієнта.','Покладіть матеріал на місце, а пінцет залиште на стерильному лотку, а не на столі.'],
e:'Лікар підготував ватні валики і тепер має розмістити їх по обидва боки від нижніх зубів для ізоляції від слини, не торкаючись руками.'}},

{id:'probe',cat:'dg',en:'Periodontal probe',
ru:{n:'Пародонтальный зонд',
o:'Тонкий зонд с закруглённым кончиком и миллиметровой шкалой. Измеряет глубину пародонтальных карманов, рецессию десны и уровень прикрепления.',
i:['Держите модифицированным перьевым хватом, упор на соседний зуб.','Введите кончик в десневую борозду параллельно оси зуба, с силой не более 20 г (лёгкое давление).','Двигайтесь «шагающими» движениями, измеряя в шести точках вокруг зуба.','Считайте значение по ближайшей метке на уровне края десны, запишите в пародонтальную карту.'],
e:'У пациента кровоточит десна. Врач вводит тонкий инструмент в борозду и фиксирует, что до дна кармана 5 мм, это значит наличие патологического кармана.'},
uk:{n:'Пародонтальний зонд',
o:'Тонкий зонд із заокругленим кінчиком та міліметровою шкалою. Вимірює глибину пародонтальних кишень, рецесію ясен та рівень прикріплення.',
i:['Тримайте модифікованим пером-хватом, упор на сусідній зуб.','Введіть кінчик в ясенну борозну паралельно осі зуба, з силою не більше 20 г (легкий тиск).','Рухайтеся «крокуючими» рухами, вимірюючи у шести точках навколо зуба.','Зчитайте значення за найближчою міткою на рівні краю ясен, запишіть у пародонтальну карту.'],
e:'У пацієнта кровоточать ясна. Лікар вводить тонкий інструмент у борозну і фіксує, що до дна кишені 5 мм, це означає наявність патологічної кишені.'}},

{id:'excavator',cat:'th',en:'Spoon excavator',
ru:{n:'Экскаватор (ложка)',
o:'Двусторонний ручной инструмент с рабочей частью в виде острой ложечки. Удаляет размягчённый кариозный дентин, остатки пломбы и временных цементов.',
i:['Держите модифицированным перьевым хватом, упор на зуб.','Вводите ложечку под край размягчённого дентина и снимайте его слоями в направлении от стенок к центру.','Работайте тягой на себя или вбок, не продавливая дно полости.','Остановитесь, когда дентин станет твёрдым (звук и ощущение при зондировании).'],
e:'После препарирования бором у дна кариозной полости остался влажный размягчённый дентин, который врач аккуратно счищает вручную рядом с пульпой.'},
uk:{n:'Екскаватор (ложка)',
o:'Двосторонній ручний інструмент із робочою частиною у вигляді гострої ложечки. Видаляє розм’якшений каріозний дентин, залишки пломби та тимчасових цементів.',
i:['Тримайте модифікованим пером-хватом, упор на зуб.','Заводьте ложечку під край розм’якшеного дентину та знімайте його шарами у напрямку від стінок до центру.','Працюйте тягою на себе або убік, не продавлюючи дно порожнини.','Зупиніться, коли дентин стане твердим (звук і відчуття при зондуванні).'],
e:'Після препарування бором біля дна каріозної порожнини залишився вологий розм’якшений дентин, який лікар обережно знімає вручну поблизу пульпи.'}},

{id:'plugger',cat:'th',en:'Plugger (condenser)',
ru:{n:'Штопфер (конденсор)',
o:'Инструмент с плоским или рифлёным торцом рабочей части. Уплотняет пломбировочный материал (амальгаму, гуттаперчу, стеклоиономер) в полости и прижимает его к стенкам.',
i:['Выберите размер штопфера по ширине полости.','Внесите порцию материала в полость и надавите торцом по направлению ко дну.','Уплотняйте слоями, смещаясь к краям, чтобы не оставлять пустот.','Очищайте рабочий конец от материала влажным тампоном.'],
e:'Врач вносит в полость первую порцию материала и сразу уплотняет её вдоль стенок, чтобы пломба плотно прилегала к краям без пор.'},
uk:{n:'Штопфер (конденсор)',
o:'Інструмент з плоским або рифленим торцем робочої частини. Ущільнює пломбувальний матеріал (амальгаму, гутаперчу, склоіономер) у порожнині та притискає його до стінок.',
i:['Оберіть розмір штопфера за шириною порожнини.','Внесіть порцію матеріалу в порожнину і натисніть торцем у напрямку до дна.','Ущільнюйте шарами, зміщуючись до країв, щоб не залишати порожнин.','Очищуйте робочий кінець від матеріалу вологим тампоном.'],
e:'Лікар вносить у порожнину першу порцію матеріалу та одразу ущільнює її вздовж стінок, щоб пломба щільно прилягала до країв без пор.'}},

{id:'burnisher',cat:'th',en:'Ball burnisher',
ru:{n:'Гладилка шаровидная',
o:'Рабочая часть в форме шарика или овала. Сглаживает и моделирует поверхность свежей пломбы, формирует бугры и фиссуры, уплотняет край.',
i:['Выберите конец инструмента по размеру полости.','Слегка смочите шарик или протрите его, чтобы материал не прилипал.','Проводите по поверхности пломбы плавными движениями от центра к краям.','Моделируйте рельеф фиссур и бугров, пока материал ещё пластичный.'],
e:'Врач внёс последнюю порцию пломбировочного материала и придаёт жевательной поверхности естественный рельеф до того, как материал затвердеет.'},
uk:{n:'Гладилка кулькоподібна',
o:'Робоча частина у формі кульки або овалу. Згладжує та моделює поверхню свіжої пломби, формує горби й фісури, ущільнює край.',
i:['Оберіть кінець інструмента за розміром порожнини.','Злегка змочіть кульку або протріть її, щоб матеріал не прилипав.','Проводьте по поверхні пломби плавними рухами від центру до країв.','Моделюйте рельєф фісур і горбів, поки матеріал ще пластичний.'],
e:'Лікар вніс останню порцію пломбувального матеріалу та надає жувальній поверхні природного рельєфу до того, як матеріал затвердне.'}},

{id:'spatula',cat:'th',en:'Cement spatula',
ru:{n:'Шпатель для цементов',
o:'Гибкий плоский шпатель из нержавеющей стали. Служит для замешивания порошка и жидкости стеклоиономерных, фосфатных и других цементов на блоке или стекле.',
i:['Разместите порошок и жидкость на чистом блоке или стекле.','Разделите порошок на порции и вводите их в жидкость по очереди.','Замешивайте круговыми движениями плоскостью шпателя до однородной консистенции.','Вовремя нанесите материал, пока он не начал схватываться, и сразу очистите шпатель.'],
e:'Для фиксации коронки врачу нужно смешать порошок и жидкость цемента до густой сметанообразной массы за 30–40 секунд.'},
uk:{n:'Шпатель для цементів',
o:'Гнучкий плаский шпатель з нержавіючої сталі. Слугує для замішування порошку й рідини склоіономерних, фосфатних та інших цементів на блоці або склі.',
i:['Розмістіть порошок і рідину на чистому блоці або склі.','Розділіть порошок на порції та вводьте їх у рідину по черзі.','Замішуйте круговими рухами площиною шпателя до однорідної консистенції.','Вчасно нанесіть матеріал, поки він не почав тужавіти, і одразу очистіть шпатель.'],
e:'Для фіксації коронки лікарю потрібно змішати порошок і рідину цементу до густої сметаноподібної маси за 30–40 секунд.'}},

{id:'matrix',cat:'th',en:'Tofflemire matrix retainer',
ru:{n:'Матрицедержатель Тофлемайра',
o:'Держатель металлической матричной ленты. Создаёт временную стенку полости при пломбировании контактных поверхностей жевательных зубов (II класс по Блэку) и формирует естественный контакт.',
i:['Вставьте ленту в головку держателя и закрепите её винтом.','Наденьте ленту петлёй на зуб, чтобы она охватывала его вокруг шейки.','Затяните петлю малым винтом по размеру зуба и проверьте, что лента плотно прилегает к десне.','Установите клин между зубами, внесите пломбу, после затвердевания ослабьте и снимите.'],
e:'В полости между двумя премолярами врач должен восстановить стенку зуба. Для этого вокруг зуба создают временную металлическую «стенку» с плотным прилеганием.'},
uk:{n:'Матрицетримач Тофлемайра',
o:'Тримач металевої матричної стрічки. Створює тимчасову стінку порожнини під час пломбування контактних поверхонь жувальних зубів (II клас за Блеком) та формує природний контакт.',
i:['Вставте стрічку в головку тримача та закріпіть її гвинтом.','Накиньте стрічку петлею на зуб, щоб вона охоплювала його навколо шийки.','Затягніть петлю малим гвинтом за розміром зуба і перевірте, що стрічка щільно прилягає до ясен.','Встановіть клин між зубами, внесіть пломбу, після затвердіння послабте та зніміть.'],
e:'У порожнині між двома премолярами лікар має відновити стінку зуба. Для цього навколо зуба створюють тимчасову металеву «стінку» з щільним прилеганням.'}},

{id:'articulating',cat:'th',en:'Articulating paper forceps (Miller)',
ru:{n:'Держатель артикуляционной бумаги (Миллера)',
o:'Пинцет-держатель с плоскими концами для полоски копировальной бумаги. Окрашивает точки контакта зубов при смыкании и показывает преждевременные контакты после пломбирования.',
i:['Зажмите полоску бумаги между концами держателя.','Попросите пациента сомкнуть зубы и поскрежетать, как при жевании.','Осмотрите отпечатки: самые интенсивные пятна говорят о высоких контактах.','Подберите пломбу или коронку бором и проверьте снова, пока нагрузка не станет равномерной.'],
e:'После установки пломбы пациент жалуется, что она «мешает» при смыкании. Врач помещает цветную полоску между зубами и ищет самую яркую точку контакта.'},
uk:{n:'Тримач артикуляційного паперу (Міллера)',
o:'Пінцет-тримач з плоскими кінцями для смужки копіювального паперу. Забарвлює точки контакту зубів при змиканні та показує передчасні контакти після пломбування.',
i:['Затисніть смужку паперу між кінцями тримача.','Попросіть пацієнта зімкнути зуби та поскрипіти, як при жуванні.','Огляньте відбитки: найінтенсивніші плями вказують на високі контакти.','Підшліфуйте пломбу чи коронку бором і перевірте знову, поки навантаження не стане рівномірним.'],
e:'Після встановлення пломби пацієнт скаржиться, що вона «заважає» при змиканні. Лікар вміщує кольорову смужку між зуби і шукає найяскравішу точку контакту.'}}
);
D.push(
{id:'kfile',cat:'en',en:'K-file (hand endodontic file)',
ru:{n:'Файл K-типа (ручной)',
o:'Тонкий конусный стальной инструмент со спиральными канавками. Расширяет и очищает корневой канал, проходит его по длине. Размер определяет цвет ручки (ISO): например 15 — белый, 20 — жёлтый, 25 — красный.',
i:['Установите резиновый стоппер на рабочую длину канала.','Смочите канал раствором и введите файл без нажима до рабочей длины.','Работайте возвратно-вращательными движениями (поворот на четверть оборота) и лёгкой подтяжкой.','Извлеките файл, очистите его, промойте канал и переходите к следующему размеру по порядку.'],
e:'При лечении пульпита врач должен расширить узкий корневой канал премоляра до рабочей длины, начиная с самого тонкого размера и постепенно увеличивая.'},
uk:{n:'Файл К-типу (ручний)',
o:'Тонкий конусний сталевий інструмент зі спіральними канавками. Розширює й очищає кореневий канал, проходить його по довжині. Розмір визначає колір ручки (ISO): наприклад 15 — білий, 20 — жовтий, 25 — червоний.',
i:['Встановіть гумовий стопер на робочу довжину каналу.','Змочіть канал розчином та введіть файл без натиску до робочої довжини.','Працюйте зворотно-обертальними рухами (поворот на чверть оберту) і легкою підтяжкою.','Вийміть файл, очистіть його, промийте канал і переходьте до наступного розміру за порядком.'],
e:'Під час лікування пульпіту лікар має розширити вузький кореневий канал премоляра до робочої довжини, починаючи з найтоншого розміру й поступово збільшуючи.'}},

{id:'spreader',cat:'en',en:'Finger spreader',
ru:{n:'Спредер корневой',
o:'Гладкий конусный остроконечный инструмент. При латеральной конденсации раздвигает гуттаперчевый штифт к стенке канала, освобождая место для дополнительных штифтов.',
i:['Подберите спредер так, чтобы он доходил на 1–2 мм до рабочей длины.','После введения основного штифта в канал вставьте спредер вдоль него.','Подавите вбок с вращением и подержите несколько секунд.','Выведите, сразу введите дополнительный штифт в образовавшееся пространство и повторите.'],
e:'В канал уже введён основной гуттаперчевый штифт с силером. Чтобы заполнить канал плотно до верхушки, врач прижимает штифт к стенке и вставляет дополнительные.'},
uk:{n:'Спредер кореневий',
o:'Гладкий конусний гостроверхий інструмент. При латеральній конденсації розсуває гутаперчевий штифт до стінки каналу, звільняючи місце для додаткових штифтів.',
i:['Підберіть спредер так, щоб він доходив на 1–2 мм до робочої довжини.','Після введення основного штифта в канал вставте спредер уздовж нього.','Натисніть убік з обертанням і потримайте кілька секунд.','Виведіть, одразу введіть додатковий штифт в утворений простір і повторіть.'],
e:'У канал уже введено основний гутаперчевий штифт із силером. Щоб заповнити канал щільно до верхівки, лікар притискає штифт до стінки та вставляє додаткові.'}},

{id:'endosyringe',cat:'en',en:'Endodontic irrigation syringe',
ru:{n:'Шприц для ирригации каналов',
o:'Шприц типа Люэр с тонкой иглой с боковым отверстием. Промывает корневой канал антисептиком (гипохлорит натрия, хлоргексидин), выносит опилки и растворяет органические остатки.',
i:['Наберите раствор и зафиксируйте иглу на конусе шприца.','Введите иглу в канал свободно, не доходя 1–2 мм до верхушки, не заклиная.','Подавайте раствор медленно, без давления, иглой двигайте вверх-вниз.','Отсасывайте раствор из полости зуба слюноотсосом, следите за тем, чтобы раствор не вышел за верхушку.'],
e:'После каждого этапа обработки корневого канала врач промывает его раствором гипохлорита натрия, чтобы вымыть опилки и дезинфицировать канал.'},
uk:{n:'Шприц для іригації каналів',
o:'Шприц типу Люер з тонкою голкою з бічним отвором. Промиває кореневий канал антисептиком (гіпохлорит натрію, хлоргексидин), виносить ошурки та розчиняє органічні залишки.',
i:['Наберіть розчин і зафіксуйте голку на конусі шприца.','Введіть голку в канал вільно, не доходячи 1–2 мм до верхівки, не заклинюючи.','Подавайте розчин повільно, без тиску, голкою рухайте вгору-вниз.','Відсмоктуйте розчин із порожнини зуба слинососом, стежте, щоб розчин не вийшов за верхівку.'],
e:'Після кожного етапу обробки кореневого каналу лікар промиває його розчином гіпохлориту натрію, щоб вимити ошурки та дезінфікувати канал.'}},

{id:'turbine',cat:'rt',en:'High-speed turbine handpiece',
ru:{n:'Турбинный наконечник',
o:'Высокоскоростной пневматический наконечник (300 000–400 000 об/мин) с водяным охлаждением и подсветкой. Применяется для быстрого препарирования эмали и дентина алмазными борами.',
i:['Присоедините наконечник к шлангу бормашины и проверьте воду и свет.','Закрепите бор в цанге до упора и проверьте, что он не болтается.','Работайте лёгкими прерывистыми касаниями с водяным охлаждением, опираясь пальцем на соседний зуб.','Не касайтесь мягких тканей, после работы промойте и смажьте по инструкции, затем стерилизуйте.'],
e:'Врач должен быстро удалить поражённую кариесом эмаль и сформировать полость. Для этого нужен инструмент с очень высокой скоростью вращения и водяным охлаждением, чтобы не перегреть зуб.'},
uk:{n:'Турбінний наконечник',
o:'Високошвидкісний пневматичний наконечник (300 000–400 000 об/хв) з водяним охолодженням та підсвіткою. Застосовується для швидкого препарування емалі й дентину алмазними борами.',
i:['Приєднайте наконечник до шланга бормашини та перевірте воду і світло.','Закріпіть бор у цанзі до упору та перевірте, що він не хитається.','Працюйте легкими переривчастими дотиками з водяним охолодженням, спираючись пальцем на сусідній зуб.','Не торкайтеся м’яких тканин, після роботи промийте й змастіть за інструкцією, потім стерилізуйте.'],
e:'Лікар має швидко видалити уражену карієсом емаль і сформувати порожнину. Для цього потрібен інструмент з дуже високою швидкістю обертання та водяним охолодженням, щоб не перегріти зуб.'}},

{id:'contra',cat:'rt',en:'Contra-angle handpiece',
ru:{n:'Угловой наконечник (контрагл)',
o:'Низкоскоростной наконечник с изгибом головки, работает от микромотора. Применяется для удаления размягчённого дентина, полировки, эндодонтии с машинными файлами.',
i:['Наденьте наконечник на микромотор до щелчка.','Вставьте бор, щётку или полировочную чашечку в головку.','Выберите скорость и направление вращения на микромоторе.','Работайте плавно, не давя сильно, после использования очистите и смажьте.'],
e:'Врач завершил пломбирование и хочет отполировать пломбу резиновой головкой на малых оборотах, чтобы убрать шероховатость.'},
uk:{n:'Кутовий наконечник (контркут)',
o:'Низькошвидкісний наконечник зі зігнутою головкою, працює від мікромотора. Застосовується для видалення розм’якшеного дентину, полірування, ендодонтії з машинними файлами.',
i:['Надіньте наконечник на мікромотор до клацання.','Вставте бор, щітку чи полірувальну чашечку в головку.','Оберіть швидкість і напрямок обертання на мікромоторі.','Працюйте плавно, не тиснучи сильно, після використання очистіть та змастіть.'],
e:'Лікар завершив пломбування та хоче відполірувати пломбу гумовою головкою на малих обертах, щоб прибрати шорсткість.'}},

{id:'diamondbur',cat:'rt',en:'Diamond bur',
ru:{n:'Алмазный бор',
o:'Бор с рабочей частью, покрытой алмазной крошкой. Цветовое кольцо показывает зернистость: синее — стандартная, красное — мелкая, зелёное — крупная. Препарирует эмаль и дентин, обтачивает зуб под коронку.',
i:['Выберите форму бора (цилиндр, конус, шар, пламя) под задачу.','Проверьте зернистость по цветному кольцу на шейке.','Закрепите в турбинном наконечнике до упора.','Работайте с водяным охлаждением короткими касаниями.'],
e:'Для обточки зуба под коронку врач выбирает рабочую часть с абразивным напылением нужной зернистости (по цветному кольцу на шейке), чтобы равномерно снять эмаль.'},
uk:{n:'Алмазний бор',
o:'Бор з робочою частиною, вкритою алмазною крихтою. Кольорове кільце показує зернистість: синє — стандартна, червоне — дрібна, зелене — крупна. Препарує емаль і дентин, обточує зуб під коронку.',
i:['Оберіть форму бора (циліндр, конус, куля, полум’я) під завдання.','Перевірте зернистість за кольоровим кільцем на шийці.','Закріпіть у турбінному наконечнику до упору.','Працюйте з водяним охолодженням короткими дотиками.'],
e:'Для обточування зуба під коронку лікар обирає робочу частину з абразивним напиленням потрібної зернистості (за кольоровим кільцем на шийці), щоб рівномірно зняти емаль.'}},

{id:'carbidebur',cat:'rt',en:'Tungsten carbide bur',
ru:{n:'Твердосплавный бор (карбидный)',
o:'Бор с рабочей частью из карбида вольфрама с режущими лезвиями. Лучше алмазного снимает пломбы, дентин и металл, режет эффективнее.',
i:['Выберите форму: фиссурный, шаровидный, грушевидный и т. д.','Закрепите бор в наконечнике до упора.','Работайте с охлаждением, снимая материал небольшими слоями.','Заменяйте бор при потере остроты, так как тупой бор перегревает зуб.'],
e:'Врач снимает старую металлическую пломбу и срезает материал по частям, пока не откроется здоровая ткань.'},
uk:{n:'Твердосплавний бор (карбідний)',
o:'Бор з робочою частиною з карбіду вольфраму з ріжучими лезами. Краще за алмазний знімає пломби, дентин та метал, ріже ефективніше.',
i:['Оберіть форму: фісурний, кулястий, грушоподібний тощо.','Закріпіть бор у наконечнику до упору.','Працюйте з охолодженням, знімаючи матеріал невеликими шарами.','Замінюйте бор при втраті гостроти, адже тупий бор перегріває зуб.'],
e:'Лікар знімає стару металеву пломбу та зрізає матеріал частинами, поки не відкриється здорова тканина.'}},

{id:'lamp',cat:'rt',en:'Dental curing light',
ru:{n:'Фотополимеризационная лампа',
o:'Светодиодная лампа синего света (длина волны 400–500 нм). Запускает полимеризацию композитных пломб, адгезивов и светоотверждаемых цементов.',
i:['Наденьте защитный экран или очки (синий свет повреждает сетчатку).','Поднесите светопровод к материалу как можно ближе, перпендикулярно поверхности.','Включите на 10–40 секунд по инструкции к материалу, толстые слои засвечивайте по очереди.','Протрите светопровод и зарядите аккумулятор.'],
e:'Врач нанёс слой композита толщиной 2 мм. Чтобы пломбировочный материал затвердел, он освещает его синим светом на 20 секунд.'},
uk:{n:'Фотополімеризаційна лампа',
o:'Світлодіодна лампа синього світла (довжина хвилі 400–500 нм). Запускає полімеризацію композитних пломб, адгезивів та світлотвердіючих цементів.',
i:['Одягніть захисний екран або окуляри (синє світло пошкоджує сітківку).','Піднесіть світловод до матеріалу якомога ближче, перпендикулярно поверхні.','Увімкніть на 10–40 секунд за інструкцією до матеріалу, товсті шари засвічуйте по черзі.','Протріть світловод і зарядіть акумулятор.'],
e:'Лікар нанес шар композиту товщиною 2 мм. Щоб пломбувальний матеріал затвердів, він освітлює його синім світлом протягом 20 секунд.'}},

{id:'sickle',cat:'hg',en:'Sickle scaler',
ru:{n:'Скейлер серповидный',
o:'Инструмент с рабочей частью треугольного сечения и двумя режущими краями, сходящимися в острие. Удаляет наддесневой зубной камень.',
i:['Держите инструмент модифицированным перьевым хватом, упор на соседний зуб.','Подведите лезвие под край камня под небольшим углом к поверхности зуба.','Тяните движением вверх или вбок, короткими движениями.','Проверьте результат зондом, при необходимости заточите инструмент.'],
e:'На язычной поверхности нижних резцов пациента есть твёрдый налёт над десной. Врач снимает его, подводя острый край под налёт.'},
uk:{n:'Скейлер серпоподібний',
o:'Інструмент з робочою частиною трикутного перерізу та двома ріжучими краями, що сходяться в вістря. Видаляє надясенний зубний камінь.',
i:['Тримайте інструмент модифікованим пером-хватом, упор на сусідній зуб.','Підведіть лезо під край каменю під невеликим кутом до поверхні зуба.','Тягніть рухом вгору чи вбік, короткими рухами.','Перевірте результат зондом, за потреби заточіть інструмент.'],
e:'На язиковій поверхні нижніх різців пацієнта є твердий наліт над яснами. Лікар знімає його, підводячи гострий край під наліт.'}},

{id:'gracey',cat:'hg',en:'Gracey curette',
ru:{n:'Кюретка Грейси',
o:'Кюретка с одним режущим краем и ложкообразной рабочей частью. Различные номера соответствуют разным поверхностям зубов. Удаляет поддесневой камень и выравнивает поверхность корня.',
i:['Выберите номер по зубу и поверхности.','Введите закрытым лезвием в карман, повернув до рабочего угла около 70°.','Подтяните к основанию камня и сделайте короткий рабочий ход вверх.','Проверьте гладкость корня зондом и промойте карман.'],
e:'При лечении пародонтита врач очищает карман глубиной 4 мм под десной от твёрдых отложений, не повреждая мягкие ткани.'},
uk:{n:'Кюрета Грейсі',
o:'Кюрета з одним ріжучим краєм та ложкоподібною робочою частиною. Різні номери відповідають різним поверхням зубів. Видаляє піддясеневий камінь та вирівнює поверхню кореня.',
i:['Оберіть номер за зубом і поверхнею.','Введіть закритим лезом у кишеню, повернувши до робочого кута близько 70°.','Підтягніть до основи каменю і зробіть короткий робочий хід угору.','Перевірте гладкість кореня зондом і промийте кишеню.'],
e:'Під час лікування пародонтиту лікар очищає кишеню глибиною 4 мм під яснами від твердих відкладень, не пошкоджуючи м’які тканини.'}},

{id:'airwater',cat:'hg',en:'Air-water syringe (3-in-1)',
ru:{n:'Водно-воздушный пистолет',
o:'Трёхфункциональный пистолет: подаёт воду, воздух или их смесь (спрей). Промывает и сушит зуб, очищает поле работы.',
i:['Нажмите кнопку воды для промывания поля.','Нажмите кнопку воздуха, чтобы высушить зуб.','Нажмите обе кнопки одновременно для спрея.','Направляйте струю, не касаясь мягких тканей, и сочетайте со слюноотсосом.'],
e:'Перед нанесением адгезива врач промывает зуб водой, а затем сушит его струёй воздуха, пока эмаль не станет матовой.'},
uk:{n:'Водно-повітряний пістолет',
o:'Трифункціональний пістолет: подає воду, повітря або їх суміш (спрей). Промиває й сушить зуб, очищає поле роботи.',
i:['Натисніть кнопку води для промивання поля.','Натисніть кнопку повітря, щоб висушити зуб.','Натисніть обидві кнопки одночасно для спрею.','Спрямовуйте струмінь, не торкаючись м’яких тканин, і поєднуйте зі слинососом.'],
e:'Перед нанесенням адгезиву лікар промиває зуб водою, а потім сушить його струменем повітря, поки емаль не стане матовою.'}},

{id:'saliva',cat:'hg',en:'Saliva ejector',
ru:{n:'Слюноотсос',
o:'Гибкая одноразовая пластиковая трубка с мягким наконечником. Отсасывает слюну и воду из полости рта пациента при лечении.',
i:['Подсоедините слюноотсос к шлангу системы аспирации.','Установите наконечник под язык или в нижний вестибулярный свод.','Расположите так, чтобы не травмировать слизистую.','После приёма утилизируйте.'],
e:'Во время пломбирования нижнего зуба у пациента скапливается слюна под языком. Помощник устанавливает трубку, чтобы поле работы оставалось сухим.'},
uk:{n:'Слиновідсмоктувач',
o:'Гнучка одноразова пластикова трубка з м’яким наконечником. Відсмоктує слину та воду з порожнини рота пацієнта під час лікування.',
i:['Приєднайте слинососа до шланга системи аспірації.','Встановіть наконечник під язик або в нижнє присінкове склепіння.','Розташуйте так, щоб не травмувати слизову.','Після прийому утилізуйте.'],
e:'Під час пломбування нижнього зуба в пацієнта збирається слина під язиком. Асистент встановлює трубку, щоб поле роботи залишалося сухим.'}},

{id:'damclamp',cat:'hg',en:'Rubber dam clamp',
ru:{n:'Кламмер для коффердама',
o:'Металлическая скоба с двумя челюстями. Фиксирует резиновую завесу на зубе и изолирует его от слюны и влаги.',
i:['Выберите кламмер по размеру зуба (моляр, премоляр, резец).','Привяжите к кламмеру страховочную нить.','Наложите кламмер на зуб щипцами и убедитесь, что челюсти охватывают шейку зуба.','Натяните резиновую завесу на зуб и поверх.'],
e:'Для лечения корневых каналов моляра врач должен полностью изолировать зуб от слюны и защитить пациента от попадания раствора.'},
uk:{n:'Кламер для коффердаму',
o:'Металева скоба з двома щелепами. Фіксує гумову завісу на зубі та ізолює його від слини і вологи.',
i:['Оберіть кламер за розміром зуба (моляр, премоляр, різець).','Прив’яжіть до кламера страхувальну нитку.','Накладіть кламер на зуб щипцями та переконайтеся, що щелепи охоплюють шийку зуба.','Натягніть гумову завісу на зуб і поверх.'],
e:'Для лікування кореневих каналів моляра лікар має повністю ізолювати зуб від слини та захистити пацієнта від потрапляння розчину.'}},

{id:'clampforceps',cat:'hg',en:'Rubber dam clamp forceps (Ainsworth)',
ru:{n:'Щипцы для кламмеров',
o:'Щипцы с храповым замком и штифтами на концах. Захватывают кламмер за отверстия, раскрывают и устанавливают его на зуб.',
i:['Вставьте штифты щипцов в отверстия кламмера.','Раскройте кламмер до размера зуба.','Заведите на зуб и опустите ниже наибольшей выпуклости.','Отпустите щипцы и убедитесь, что кламмер стабилен.'],
e:'Врач выбрал нужный кламмер и должен безопасно установить его на дальний зуб, не уронив в рот пациента.'},
uk:{n:'Щипці для кламерів',
o:'Щипці з храповим замком та штифтами на кінцях. Захоплюють кламер за отвори, розкривають його та встановлюють на зуб.',
i:['Вставте штифти щипців у отвори кламера.','Розкрийте кламер до розміру зуба.','Заведіть на зуб і опустіть нижче найбільшої опуклості.','Відпустіть щипці й переконайтеся, що кламер стабільний.'],
e:'Лікар обрав потрібний кламер і має безпечно встановити його на дальній зуб, не впустивши в рот пацієнта.'}},

{id:'damframe',cat:'hg',en:'Rubber dam frame (Young)',
ru:{n:'Рамка Янга',
o:'U-образная металлическая или пластиковая рамка с шипами. Растягивает края резиновой завесы вне полости рта, чтобы не мешала.',
i:['Расположите рамку на лице пациента, концами вверх.','Наденьте завесу на шипы, натянув ровно.','Убедитесь, что рамка не давит на нос и подбородок.','После работы снимите завесу, рамку обработайте.'],
e:'После наложения завесы врач следит, чтобы края не закрывали нос пациента и не мешали работе. Для этого края фиксируют на дуге с шипами.'},
uk:{n:'Рамка Янга',
o:'U-подібна металева або пластикова рамка з шипами. Розтягує краї гумової завіси поза порожниною рота, щоб не заважала.',
i:['Розташуйте рамку на обличчі пацієнта, кінцями вгору.','Надіньте завісу на шипи, натягнувши рівно.','Переконайтеся, що рамка не тисне на ніс і підборіддя.','Після роботи зніміть завісу, рамку обробіть.'],
e:'Після накладання завіси лікар стежить, щоб краї не закривали ніс пацієнта та не заважали роботі. Для цього краї фіксують на дузі з шипами.'}}
);
D.push(
{id:'carpule',cat:'sg',en:'Cartridge syringe (carpule injector)',
ru:{n:'Карпульный шприц',
o:'Металлический шприц многоразового использования для стеклянных карпул с анестетиком. Имеет поршень с гарпуном для аспирации и резьбу под иглу. Используется для местной анестезии.',
i:['Оттяните поршень и вставьте карпулу в боковой вырез, затем верните поршень до упора.','Наденьте иглу на резьбу, снимите защитный колпачок.','Проведите аспирационную пробу (оттяните поршень, нет ли крови), затем медленно введите раствор.','Снимите иглу безопасным способом и утилизируйте в контейнер для острых отходов.'],
e:'Перед удалением зуба врач вводит раствор анестетика рядом с нижним зубом. Он вставляет стеклянную ампулу и проверяет, не попал ли конец иглы в сосуд.'},
uk:{n:'Карпульний шприц',
o:'Металевий шприц багаторазового використання для скляних карпул з анестетиком. Має поршень з гарпуном для аспірації та різьбу під голку. Використовується для місцевої анестезії.',
i:['Відтягніть поршень і вставте карпулу в бічний виріз, потім поверніть поршень до упору.','Накрутіть голку на різьбу, зніміть захисний ковпачок.','Проведіть аспіраційну пробу (відтягніть поршень, чи немає крові), потім повільно введіть розчин.','Зніміть голку безпечним способом і утилізуйте в контейнер для гострих відходів.'],
e:'Перед видаленням зуба лікар вводить розчин анестетика поряд із нижнім зубом. Він вставляє скляну ампулу та перевіряє, чи не потрапив кінець голки в судину.'}},

{id:'forceps',cat:'sg',en:'Extraction forceps (upper straight)',
ru:{n:'Щипцы для удаления зубов (прямые)',
o:'Щипцы с рабочими щёчками, повторяющими форму шейки зуба. Прямые щипцы применяют для удаления зубов верхней челюсти (резцы, клыки, премоляры). Форма определяется зубом.',
i:['Убедитесь, что анестезия подействовала, и отделите десну от шейки зуба.','Наложите щёчки на шейку зуба как можно глубже под десну, по оси зуба.','Сделайте расшатывающие движения в щечно-небном направлении и ротацию для резцов.','Выведите зуб и осмотрите, цела ли верхушка корня.'],
e:'У пациента подвижный верхний резец, который невозможно сохранить. После анестезии врач захватывает его шейку и выводит из лунки вращением.'},
uk:{n:'Щипці для видалення зубів (прямі)',
o:'Щипці з робочими щічками, що повторюють форму шийки зуба. Прямі щипці застосовують для видалення зубів верхньої щелепи (різці, ікла, премоляри). Форма визначається зубом.',
i:['Переконайтеся, що анестезія подіяла, і відділіть ясна від шийки зуба.','Накладіть щічки на шийку зуба якомога глибше під ясна, по осі зуба.','Зробіть розхитувальні рухи в щічно-піднебінному напрямку та ротацію для різців.','Виведіть зуб й огляньте, чи ціла верхівка кореня.'],
e:'У пацієнта рухомий верхній різець, який неможливо зберегти. Після анестезії лікар захоплює його шийку та виводить із лунки обертанням.'}},

{id:'elevator',cat:'sg',en:'Straight elevator',
ru:{n:'Элеватор прямой',
o:'Рычажный инструмент с широкой ручкой и желобоватым лезвием. Расшатывает зуб и корень, отделяя его от стенок лунки перед удалением щипцами.',
i:['Введите лезвие между зубом и костной стенкой лунки с вестибулярной стороны.','Упирайтесь в кость, не на соседний зуб, и поворачивайте инструмент вокруг оси.','Контролируйте силу, держите палец у лезвия для защиты.','Когда зуб подвижен, завершите щипцами.'],

/* ===== 3D helpers & materials (all instruments are built along +Y, working end up) ===== */
const T=window.THREE;
const MK={};
const DS=T.DoubleSide;
const mat=(c,m,r,o)=>new T.MeshStandardMaterial(Object.assign({color:c,metalness:m,roughness:r},o||{}));
const plastic=(c,o)=>new T.MeshPhysicalMaterial(Object.assign({color:c,metalness:0,roughness:.32,clearcoat:1,clearcoatRoughness:.18},o||{}));
const STEEL=mat(0xe6eaee,1,.17), STEELM=mat(0xc3c9cf,1,.4), STEELD=mat(0x858d96,1,.32);
const GOLD=mat(0xd8aa45,1,.22), BLK=mat(0x14181b,.1,.5), RUB=mat(0x202427,0,.85), WHT=plastic(0xf3f5f6);
const GLASS=new T.MeshPhysicalMaterial({color:0xdcefff,metalness:0,roughness:.04,transparent:true,opacity:.32,side:DS,clearcoat:1});
const MIRROR=mat(0xffffff,1,.02);
const ms=(geo,m)=>{const x=new T.Mesh(geo,m);x.castShadow=true;x.receiveShadow=true;return x;};
const V3=(a)=>new T.Vector3(a[0],a[1],a[2]||0);

function lathe(pts,m,seg){
  const p=pts.map(q=>new T.Vector2(q[0],q[1]));
  if(p[0].x>0)p.unshift(new T.Vector2(0,p[0].y));
  if(p[p.length-1].x>0)p.push(new T.Vector2(0,p[p.length-1].y));
  return ms(new T.LatheGeometry(p,seg||56),m);
}
function knurl(y0,y1,r,m,o){
  o=o||{};const amp=o.amp==null?.05:o.amp,fr=o.freq||5,pts=[];
  for(let y=y0;y<=y1+1e-6;y+=.7){
    const e=Math.min(1,(y-y0)/3,(y1-y)/3);
    const k=1-Math.pow(1-Math.max(0,e),2)*0;
    const edge=Math.min(1,Math.sqrt(Math.max(0,Math.min((y-y0)/2.4,(y1-y)/2.4))+.02));
    pts.push([r*edge*(1+amp*Math.sin(fr*y))*k,y]);
  }
  return lathe(pts,m,o.seg||40);
}
function cyl(r0,r1,h,m,seg,y){const g=new T.CylinderGeometry(r1,r0,h,seg||32);g.translate(0,h/2+(y||0),0);return ms(g,m);}
function ball(r,m,x,y,z){const b=ms(new T.SphereGeometry(r,28,20),m);b.position.set(x||0,y||0,z||0);return b;}
function box(w,h,d,m,x,y,z){const b=ms(new T.BoxGeometry(w,h,d),m);b.position.set(x||0,y||0,z||0);return b;}
function torus(R,r,m,x,y,z,seg){const t=ms(new T.TorusGeometry(R,r,16,seg||48),m);t.position.set(x||0,y||0,z||0);return t;}
function between(a,b,r0,r1,m,seg){
  const A=V3(a),B=V3(b),d=B.clone().sub(A),len=d.length();
  const g=new T.CylinderGeometry(r1,r0,len,seg||24);

/* swept tube along a smooth path. rfn(t)->r or [a,b]; o.up -> keeps the section oriented (flat blades) */
function tube(path,rfn,m,o){
  o=o||{};const cv=new T.CatmullRomCurve3(path.map(V3),false,'centripetal');
  const N=o.n||64,S=o.seg||18,P=[],Tg=[];
  for(let i=0;i<=N;i++){P.push(cv.getPointAt(i/N));Tg.push(cv.getTangentAt(i/N));}
  const pos=[],idx=[];let pB=null;const up=o.up?V3(o.up):null;const ring=[];
  for(let i=0;i<=N;i++){
    const t=i/N,Tn=Tg[i];let B;
    if(up){B=up.clone().sub(Tn.clone().multiplyScalar(up.dot(Tn))).normalize();}
    else if(!pB){const ref=Math.abs(Tn.x)<.9?new T.Vector3(1,0,0):new T.Vector3(0,1,0);B=ref.sub(Tn.clone().multiplyScalar(ref.dot(Tn))).normalize();}
    else{B=pB.clone().sub(Tn.clone().multiplyScalar(pB.dot(Tn))).normalize();}
    pB=B;const Nn=new T.Vector3().crossVectors(B,Tn).normalize();
    const r=rfn(t),a=Array.isArray(r)?r[0]:r,b=Array.isArray(r)?r[1]:r;
    const row=[];
    if(o.profile){
      o.profile.forEach(q=>{const p=P[i].clone().addScaledVector(Nn,q[0]).addScaledVector(B,q[1]);row.push(pos.length/3);pos.push(p.x,p.y,p.z);});
    }else{
      for(let j=0;j<S;j++){
        const ph=j/S*Math.PI*2;
        let k=1;if(o.lobes)k=1+o.lobes.amp*Math.cos(o.lobes.n*ph-(o.lobes.twist||0)*t);
        const p=P[i].clone().addScaledVector(Nn,Math.cos(ph)*a*k).addScaledVector(B,Math.sin(ph)*b*k);
        row.push(pos.length/3);pos.push(p.x,p.y,p.z);
      }
    }
    ring.push(row);
  }
  const W=o.profile?o.profile.length-1:S;
  for(let i=0;i<N;i++)for(let j=0;j<W;j++){
    const a=ring[i][j],b=ring[i+1][j],c=ring[i+1][(j+1)%ring[0].length],d=ring[i][(j+1)%ring[0].length];
    idx.push(a,c,b,a,d,c);
  }
  if(!o.profile&&o.caps!==false){
    [0,N].forEach(e=>{
      const c0=pos.length/3;pos.push(P[e].x,P[e].y,P[e].z);const base=pos.length/3;
      ring[e].forEach(vi=>pos.push(pos[vi*3],pos[vi*3+1],pos[vi*3+2]));
      for(let j=0;j<S;j++){const u=base+j,v=base+(j+1)%S;if(e===0)idx.push(c0,v,u);else idx.push(c0,u,v);}

}
function rib(path,wfn,thk,m,o){return tube(path,t=>[thk,wfn(t)],m,Object.assign({up:[0,0,1],seg:20},o||{}));}
function flat(pts,depth,m,bev,smooth){

  const sh=new T.Shape();p.forEach((q,i)=>i?sh.lineTo(q[0],q[1]):sh.moveTo(q[0],q[1]));

/* double-ended hand instrument: 120 long handle centred at 0, working ends start at y=±60 */
function handle(len,r,m){
  const g=grp();const h=len/2;
  g.add(knurl(-h,h,r,m||STEELM,{amp:.05,freq:4.4}));
  return g;
}
function neck(m){return lathe([[4.2,0],[3.6,2.5],[2.6,7],[1.8,13],[1.6,16]],m||STEELM,40);}
function dbl(A,B,len,r){
  const g=grp();g.add(handle(len||120,r||4.2));
  const a=A();a.position.y=(len||120)/2;g.add(a);
  if(B){const b=B();b.rotation.z=Math.PI;b.position.y=-(len||120)/2;g.add(b);}
  else{const b=A();b.rotation.z=Math.PI;b.position.y=-(len||120)/2;g.add(b);}
  return g;
}
const taper=(r0,r1)=>t=>r0+(r1-r0)*t;

/* ===== 1 mirror ===== */
MK.mirror=function(){
  const g=grp();
  g.add(knurl(0,95,4.2,STEELM,{amp:.05,freq:4.4}));
  g.add(at(lathe([[4.2,95],[3.4,98],[2.4,104],[1.8,112],[1.6,116]],STEELM,40)));
  g.add(tube([[0,112,0],[0,128,0],[0,140,0],[1.2,150,0]],taper(1.6,1.3),STEEL));
  const head=grp();
  head.add(at(ms(new T.CylinderGeometry(11.6,11.6,3.6,64),STEEL)));
  const face=ms(new T.CylinderGeometry(10.2,10.2,.5,64),MIRROR);face.position.y=1.9;head.add(face);
  head.add(torus(10.9,.9,STEEL,0,1.9,0,64).rotateX(Math.PI/2));
  head.rotation.x=0;head.position.set(1.2,160,0);
  head.rotation.z=0;head.rotation.x=Math.PI/2-.35;
  g.add(head);
  g.add(tube([[1.2,150,0],[1.2,156,0]],()=>1.3,STEEL));
  return g;
};

/* ===== 3 tweezers ===== */
function tweezerArms(o){
  const g=grp();
  [-1,1].forEach(s=>{
    const arm=rib(o.path(s),t=>o.w*(1-.15*Math.abs(t-.4)),o.th,STEELM,{n:90});
    arm.position.z=s*0;g.add(arm);
  });
  return g;
}
MK.tweezers=function(){
  const g=grp();
  const path=s=>[[s*1.1,0],[s*3.2,28],[s*6,70],[s*5.6,100],[s*2.4,122],[s*.55,138],[s*.4,146]];
  g.add(tweezerArms({path,w:2.6,th:.55}));
  /* serrated grip pads */
  for(let k=0;k<10;k++){const y=16+k*3.6;[-1,1].forEach(s=>{const x=s*(2.7+y*.047)+s*.6;g.add(box(.5,.7,3.3,STEEL,x,y,0));});}
  g.add(box(5.2,5,3,STEELM,0,-2,0));
  /* angled beaks */
  [-1,1].forEach(s=>{const b=rib([[s*.45,140],[s*.4,146],[s*.4,150]],()=>1.6,.5,STEEL,{n:8});g.add(b);});
  g.rotation.z=0;return g;
};
MK.tweezers.rot=[0,0,-Math.PI/2];

    return e;

function spoon(r,m){
  const g=grp();
  const c=ms(new T.SphereGeometry(r,28,16,0,Math.PI*2,0,Math.PI*.5),m.clone());c.material.side=DS;
  c.scale.set(1,.85,.75);g.add(c);
  g.add(torus(r,.14*r,STEEL,0,0,0,40).rotateX(Math.PI/2));
  return g;
}
MK.excavator=function(){
  return dbl(function(){
    const e=grp();e.add(neck());
    e.add(tube([[0,14,0],[0,28,0],[1.4,40,0],[4.6,49,0],[8,52,0]],t=>1.5-.35*t,STEEL,{n:70}));
    const s=spoon(2.7,STEEL);s.position.set(8.4,52.4,0);s.rotation.z=-Math.PI/2+.25;s.rotation.x=0;e.add(s);
    return e;

/* ===== 6 plugger ===== */
MK.plugger=function(){
  const mk=(r,serr)=>function(){
    const e=grp();e.add(neck());
    e.add(tube([[0,14,0],[0,30,0],[1.8,44,0],[4.6,52,0],[4.8,58,0]],t=>1.5+.15*t,STEEL,{n:70}));
    const tip=cyl(r*.9,r,5,STEEL,32,0);tip.position.set(4.8,58,0);e.add(tip);
    if(serr){for(let i=0;i<5;i++){const c=box(.3,.3,r*2,BLK,4.8+(i-2)*.55*r/1.2,63.2,0);c.visible=false;e.add(c);}
      const face=ms(new T.CylinderGeometry(r,r,.2,32),STEELD);face.position.set(4.8,63.1,0);e.add(face);}
    return e;
  };
  return dbl(mk(1.3,true),mk(2.1,true));
};

/* ===== 8 cement spatula ===== */
MK.spatula=function(){
  const blade=(L,W)=>function(){
    const e=grp();e.add(neck());
    e.add(tube([[0,14,0],[0,22,0],[0,26,0]],()=>1.5,STEEL,{n:8}));
    e.add(rib([[0,24,0],[0,34,0],[.6,50,0],[1.2,24+L,0]],t=>{
      const w=1.4+(W-1.4)*Math.sin(Math.min(1,t*2.4)*Math.PI/2);
      return w*Math.sqrt(Math.max(0,1-Math.pow(t,7)));},.35,STEEL,{n:80}));
    return e;
  };
  return dbl(blade(46,6),blade(38,4));
};
MK.spatula.rot=[0,0,-Math.PI/2];

/* ===== 9 Tofflemire matrix retainer ===== */
MK.matrix=function(){
  const g=grp();
  /* main shaft with knurled big knob */
  g.add(knurl(-14,0,8.2,STEELM,{amp:.06,freq:4.2,seg:48}));
  g.add(cyl(5.4,5.4,34,STEELM,48,0));
  g.add(knurl(34,40,3.8,STEELM,{amp:.04,freq:5}));
  /* head */
  g.add(box(11,13,7,STEELM,0,48,0));
  g.add(box(11.4,1.6,7.4,STEEL,0,55,0));
  /* slot where band end is held */
  const slot=box(3.2,7,7.6,BLK,-1.5,49,0);g.add(slot);
  /* guide arms */
  g.add(box(2.2,10,5,STEEL,6.6,49,0));
  /* side spindle with small knob */
  const sp=cyl(1.6,1.6,22,STEEL,24,0);sp.rotation.z=-Math.PI/2;sp.position.set(7,22,0);g.add(sp);
  const kn=knurl(0,8,4.4,STEELM,{amp:.06,freq:4});kn.rotation.z=-Math.PI/2;kn.position.set(25,22,0);g.add(kn);
  /* matrix band loop */
  const band=ms(new T.CylinderGeometry(8.2,8.2,7,56,1,true),STEELM.clone());band.material.side=DS;band.material.color.set(0xd9dde1);
  band.scale.set(1,1,.78);band.position.set(-2,64,0);band.rotation.x=0;g.add(band);
  /* band tail going into the slot */
  g.add(rib([[-9,64,0],[-8,58,0],[-3,54,0],[-1.5,50,0]],()=>3.2,.15,STEELM,{n:20}));
  return g;
};
MK.matrix.rot=[0,0,-Math.PI/2+.5];

function endoHandle(col,len){
  const g=grp();
  const pm=plastic(col);
  g.add(lathe([[2.3,-len],[3.1,-len+1.2],[3.4,-len*.6],[3.3,-3],[2.6,-.5],[2.4,0]],pm,36));
  [0,1,2].forEach(i=>g.add(torus(3.35,.12,STEELD,0,-len*.82+i*.0,0).rotateX(Math.PI/2).translateZ(0)));
  g.children.slice(-3).forEach((r,i)=>r.position.y=-len*.5+i*1.4);
  g.add(lathe([[2.3,0],[2.1,2],[1.6,5],[1.25,8]],STEELM,28));
  return g;
}

/* ===== rotary instruments ===== */
function handHead(rH,len,burShank,burHead,cap){
  const g=grp();
  g.add(lathe([[rH*.78,-len/2],[rH,-len/2+1.4],[rH,len/2-1.4],[rH*.8,len/2]],STEEL,48));
  g.add(lathe([[rH*.55,len/2],[rH*.55,len/2+1.3],[rH*.4,len/2+2]],cap||STEELM,32));
  g.add(lathe([[rH*.55,-len/2],[rH*.4,-len/2-2.5],[rH*.28,-len/2-4]],STEELM,32));
  g.add(tube([[0,-len/2-3,0],[0,-len/2-burShank,0]],()=>.8,STEEL,{n:8,seg:16}));
  const by=-len/2-burShank;
  g.add(lathe(burHead.map(p=>[p[0],by+p[1]]),mat(0x9aa3ac,1,.65),32));
  return g;
}

  e.add(tube(path,t=>1.55-.55*t,STEEL,{n:70}));
  if(kind==='sickle'){
    const b=flat([[-1.4,0],[1.5,.5],[.4,16]],1.15,STEEL,.12);b.position.set(5.4,57.5,0);b.rotation.z=-.5;e.add(b);
    const r=box(.01,.01,.01,STEEL);e.add(r);
  }else{
    const c=ms(new T.CylinderGeometry(1.25,.95,12,24,1,true,0,Math.PI),STEEL.clone());c.material.side=DS;

function hinged(o){
  const g=grp();const H=o.H,J=o.J,hx=o.hx,m=o.mat||STEEL;
  const p0=H/(H+J+8);
  [-1,1].forEach(s=>{
    const path=[[s*hx,-H],[s*hx*.62,-H*.62],[s*hx*.22,-H*.24],[s*.6,-6],[0,0],[-s*.6,6],[-s*.5,J*.35],[-s*.3,J*.75],[-s*.12,J]];
    const w=t=>{
      if(t<p0*.92)return o.hw+(o.pw-o.hw)*Math.pow(t/p0,3);
      const u=(t-p0)/(1-p0);return o.jw?o.jw(u):o.pw;
    };
    const arm=rib(path,w,o.th,m,{n:110});arm.position.z=s*(o.dz||.8);g.add(arm);
    if(o.ring){
      const R=o.ring;
      const r=torus(R,o.rt||1.2,o.ringMat||m,s*(hx+R*.62),-H-R*.78,s*(o.dz||.8),56);r.rotation.z=0;g.add(r);

    }
    if(o.ratchet){
      const rb=box(hx*.55,.9,1.2,STEELM,s*hx*.3,-H*.55+s*0,s*1.7);g.add(rb);
      for(let k=0;k<5;k++)g.add(box(.5,1.4,1.2,STEELM,s*hx*(.08+k*.1),-H*.55+.8,s*1.7));
    }
    if(o.tip)o.tip(g,s);
  });
  const piv=cyl(2.1,2.1,3.8,STEELM,32,-1.9);piv.rotation.x=Math.PI/2;g.add(piv);
  const scr=cyl(1.1,1.1,.5,STEELD,24,1.9);scr.rotation.x=Math.PI/2;scr.position.z=1;g.add(scr);
  return g;
}

    const up=e=>{ptr.delete(e.pointerId);if(!ptr.size)st.hold=false;pinch=0;};
    c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
    c.addEventListener('wheel',e=>{e.preventDefault();st.zoom=clampZ(st.zoom*Math.exp(e.deltaY*.0012));},{passive:false});
    c.addEventListener('dblclick',()=>reset());
    window.addEventListener('resize',resize);
    ok=true;loop();return true;
  }
  function dist2(){const a=[...ptr.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;}
  function clampZ(z){return Math.max(.35,Math.min(1.6,z));}
  function resize(){
    if(!r||!el)return;
    const w=el.clientWidth||300,h=el.clientHeight||300;sz={w,h};
    r.setSize(w,h,false);cam.aspect=w/h;
    st.fitD=Math.max(st.fit,5.3/cam.aspect);cam.updateProjectionMatrix();
  }
  function build(id){
    if(cache[id])return cache[id];
    let g;
    try{g=MK[id]();}catch(e){console.error(id,e);g=new T.Group();}
    const fn=MK[id];const rot=fn.rot||[0,0,-Math.PI/2];
    g.rotation.set(rot[0],rot[1],rot[2]);
    const w=new T.Group();w.add(g);w.updateMatrixWorld(true);
    let box=new T.Box3().setFromObject(w);const sp=box.getBoundingSphere(new T.Sphere());
    const s=1.55*(fn.k||1)/sp.radius;w.scale.setScalar(s);w.updateMatrixWorld(true);
    box=new T.Box3().setFromObject(w);const c=box.getCenter(new T.Vector3());
    w.position.sub(c);box.translate(c.clone().negate());
    cache[id]={w,minY:box.min.y};return cache[id];
  }
  function show(id){
    if(!ok)return;
    const b=build(id);while(root.children.length)root.remove(root.children[0]);
    root.add(b.w);ground.position.y=b.minY-.04;cur=id;reset(true);
  }
  function reset(soft){st.th=.62;st.ph=1.22;st.zoom=1;if(!soft)st.auto=st.auto;}
  function loop(){
    requestAnimationFrame(loop);
    if(!el||!el.isConnected||el.offsetParent===null)return;
    if(sz.w!==el.clientWidth||sz.h!==el.clientHeight)resize();
    if(st.auto&&!st.hold)st.th+=.0045;
    const d=(st.fitD||st.fit)*st.zoom;
    cam.position.set(d*Math.sin(st.ph)*Math.sin(st.th),d*Math.cos(st.ph),d*Math.sin(st.ph)*Math.cos(st.th));
    cam.lookAt(0,0,0);r.render(scene,cam);
  }
  function mount(host,ov){
    el=host;host.prepend(r.domElement);if(ov)host.append(ov);resize();
  }
  return {init,mount,show,reset,get ok(){return ok;},toggleAuto(){st.auto=!st.auto;return st.auto;},get auto(){return st.auto;},get cur(){return cur;}};
})();

      foot:'Моделі побудовано програмно за реальними формами та пропорціями інструментів, вони слугують для розпізнавання. Конкретні моделі й розміри в різних виробників відрізняються. Уточнюйте інструкції й протоколи в підручниках та в наставника клініки.'}
  };
  let lang='ru',view='learn',cur=D[0].id,cat='all',query='',learned=new Set();
  try{lang=localStorage.getItem('da_lang')||'ru';learned=new Set(JSON.parse(localStorage.getItem('da_done')||'[]'));}catch(e){}
  if(!UI[lang])lang='ru';
  const t=k=>UI[lang][k];
  const save=()=>{try{localStorage.setItem('da_lang',lang);localStorage.setItem('da_done',JSON.stringify([...learned]));}catch(e){}};
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const byId=id=>D.find(d=>d.id===id);
  const L=d=>d[lang];

  /* stage overlay (hint + buttons) moved between views */
  const ov=document.createElement('div');
  function buildOverlay(){
    ov.innerHTML='<div class="stagelabel">'+esc(t('model'))+'</div><div class="hint">'+esc(t('hint'))+'</div><div class="tools"><button id="bReset" type="button">'+esc(t('reset'))+'</button><button id="bAuto" type="button" aria-pressed="'+Viewer.auto+'">'+esc(t('auto'))+'</button></div>';
    ov.querySelector('#bReset').onclick=()=>Viewer.reset();
    ov.querySelector('#bAuto').onclick=e=>{e.currentTarget.setAttribute('aria-pressed',Viewer.toggleAuto());};
  }
  function mountStage(host){
    if(!Viewer.ok){host.innerHTML='<div class="fail">'+esc(t('fail'))+'</div>';return;}
    buildOverlay();Viewer.mount(host,ov);
  }

  function renderChrome(){
    $('#ttl').textContent=t('title');$('#sub').textContent=t('sub');
    $$('#tabs button').forEach(b=>{b.textContent=t(b.dataset.v);b.setAttribute('aria-pressed',b.dataset.v===view);});
    $$('#lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
    $('#q').placeholder=t('search');$('#foot').textContent=t('foot');
    document.documentElement.lang=lang==='uk'?'uk':'ru';
  }
  function filtered(){
    const q=query.trim().toLowerCase();
    return D.filter(d=>(cat==='all'||d.cat===cat)&&(!q||(L(d).n+' '+d.en+' '+D_ALT(d)).toLowerCase().includes(q)));
  }
  const D_ALT=d=>d.ru.n+' '+d.uk.n;

  function renderSide(){
    $('#cats').innerHTML=['all',...Object.keys(CATS)].map(k=>'<button type="button" class="chip" data-c="'+k+'" aria-pressed="'+(k===cat)+'">'+esc(k==='all'?t('all'):CATS[k][lang])+'</button>').join('');
    $$('#cats .chip').forEach(b=>b.onclick=()=>{cat=b.dataset.c;renderSide();});
    const f=filtered();
    $('#list').innerHTML=f.length?f.map(d=>'<li><button type="button" data-id="'+d.id+'" class="'+(learned.has(d.id)?'done':'')+'" '+(d.id===cur?'aria-current="true"':'')+'><span class="dot"></span><span>'+esc(L(d).n)+'</span></button></li>').join(''):'<li class="prog">'+esc(t('none'))+'</li>';
    $$('#list button').forEach(b=>b.onclick=()=>select(b.dataset.id));
    $('#prog').textContent=learned.size+' / '+D.length+' '+t('studied');
    $('#progbar').style.width=(learned.size/D.length*100)+'%';
  }
  function select(id){cur=id;renderSide();renderInfo();Viewer.show(id);}
  function renderInfo(){
    const d=byId(cur),x=L(d),i=D.indexOf(d);
    $('#info').innerHTML=
      '<div class="head"><div><span class="tag">'+esc(CATS[d.cat][lang])+'</span><h2>'+esc(x.n)+'</h2><div class="en">'+esc(d.en)+'</div></div>'+
      '<button type="button" class="btn '+(learned.has(d.id)?'on':'pri')+'" id="bMark">'+esc(learned.has(d.id)?t('marked'):t('mark'))+'</button></div>'+
      '<div class="sections"><section class="wide"><h3>'+esc(t('overview'))+'</h3><p>'+esc(x.o)+'</p></section>'+
      '<section><h3>'+esc(t('steps'))+'</h3><ol>'+x.i.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol></section>'+
      '<section><h3>'+esc(t('example'))+'</h3><p class="example">'+esc(x.e)+'</p></section></div>'+
      '<div class="nav" style="margin-top:18px"><button type="button" class="btn" id="bPrev">'+esc(t('prev'))+'</button><button type="button" class="btn" id="bNext">'+esc(t('next'))+'</button></div>';
    $('#bMark').onclick=()=>{learned.has(d.id)?learned.delete(d.id):learned.add(d.id);save();renderSide();renderInfo();};
    $('#bPrev').onclick=()=>select(D[(i-1+D.length)%D.length].id);
    $('#bNext').onclick=()=>select(D[(i+1)%D.length].id);
  }

  /* ===== test ===== */
  const TS={sel:new Set(Object.keys(CATS)),count:10,qs:[],idx:0,score:0,wrong:[],answered:false};
  const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  function renderSetup(){
    const box=$('#testbox');
    const pool=D.filter(d=>TS.sel.has(d.cat)).length;
    const counts=[10,20,36].filter(c=>c<=Math.max(10,pool));
    box.innerHTML='<div class="card setup"><h2>'+esc(t('tstart'))+'</h2>'+
      '<div><label class="lbl">'+esc(t('tcats'))+'</label><div class="chips" id="tc">'+Object.keys(CATS).map(k=>'<button type="button" class="chip" data-c="'+k+'" aria-pressed="'+TS.sel.has(k)+'">'+esc(CATS[k][lang])+'</button>').join('')+'</div></div>'+
      '<div><label class="lbl">'+esc(t('tcount'))+'</label><div class="chips" id="tn">'+counts.map(c=>'<button type="button" class="chip" data-n="'+c+'" aria-pressed="'+(Math.min(TS.count,pool)===Math.min(c,pool))+'">'+(c>=pool?pool:c)+'</button>').join('')+'</div></div>'+
      '<div><button type="button" class="btn pri" id="go" '+(pool<4?'disabled':'')+'>'+esc(t('tbegin'))+'</button></div></div>';
    $$('#tc .chip').forEach(b=>b.onclick=()=>{const k=b.dataset.c;TS.sel.has(k)?TS.sel.delete(k):TS.sel.add(k);renderSetup();});
    $$('#tn .chip').forEach(b=>b.onclick=()=>{TS.count=+b.dataset.n;renderSetup();});
    $('#go').onclick=()=>startTest(D.filter(d=>TS.sel.has(d.cat)),TS.count);
  }
  function startTest(pool,n){
    TS.qs=shuffle(pool).slice(0,Math.min(n,pool.length));TS.idx=0;TS.score=0;TS.wrong=[];renderQ();
  }
  function renderQ(){
    const d=TS.qs[TS.idx];TS.answered=false;
    const same=shuffle(D.filter(x=>x.id!==d.id&&x.cat===d.cat)),other=shuffle(D.filter(x=>x.id!==d.id&&x.cat!==d.cat));
    const opts=shuffle([d,...same.concat(other).slice(0,3)]);
    const box=$('#testbox');
    box.innerHTML='<div class="qhead"><span>'+esc(t('q'))+' '+(TS.idx+1)+' '+esc(t('of'))+' '+TS.qs.length+'</span><span>'+TS.score+' ✓</span></div>'+
      '<div class="qgrid"><div class="stagewrap"><div class="stage" id="stageT"></div></div>'+
      '<div class="card"><h3 style="font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 6px">'+esc(t('ex'))+'</h3>'+
      '<p style="margin:0 0 14px">'+esc(L(d).e)+'</p>'+
      '<div style="font:600 17px var(--f-head)">'+esc(t('what'))+'</div>'+
      '<div class="opts" id="opts">'+opts.map((o,k)=>'<button type="button" class="opt" data-id="'+o.id+'"><span class="k">'+(k+1)+'</span>'+esc(L(o).n)+'</button>').join('')+'</div>'+
      '<div id="fb"></div><div style="margin-top:12px"><button type="button" class="btn" id="hintb">'+esc(t('check'))+'</button> <span class="en" id="hintv"></span></div></div></div>';
    mountStage($('#stageT'));Viewer.show(d.id);
    $('#hintb').onclick=()=>{$('#hintv').textContent=CATS[d.cat][lang];};
    $$('#opts .opt').forEach(b=>b.onclick=()=>answer(b.dataset.id,d));
  }
  function answer(id,d){
    if(TS.answered)return;TS.answered=true;
    const okk=id===d.id;if(okk)TS.score++;else TS.wrong.push(d.id);
    $$('#opts .opt').forEach(b=>{b.disabled=true;if(b.dataset.id===d.id)b.classList.add('good');else if(b.dataset.id===id)b.classList.add('bad');});
    const last=TS.idx===TS.qs.length-1;
    $('#fb').innerHTML='<div class="fb '+(okk?'good':'bad')+'"><strong>'+esc(okk?t('right'):t('wrong')+' '+L(d).n)+'</strong><p style="margin:6px 0 0">'+esc(L(d).o)+'</p></div>'+
      '<div style="margin-top:12px"><button type="button" class="btn pri" id="nq">'+esc(last?t('finish'):t('nextq'))+'</button></div>';

    $('#nq').focus();
  }
  function renderResult(){
    const n=TS.qs.length,pct=Math.round(TS.score/n*100);

      (TS.wrong.length?'<div><label class="lbl">'+esc(t('mistakes'))+'</label><ul class="wrong">'+TS.wrong.map(id=>'<li><span>'+esc(L(byId(id)).n)+'</span><button type="button" class="chip" data-s="'+id+'">'+esc(t('study'))+'</button></li>').join('')+'</ul></div>':'<p>'+esc(t('nomist'))+'</p>')+

  }

  function setView(v){
    view=v;$('#learn').hidden=v!=='learn';$('#test').hidden=v!=='test';renderChrome();

  }

  window.__atlas={show:id=>{cur=id;renderSide();renderInfo();Viewer.show(id);},ids:()=>D.map(d=>d.id),Viewer};
  setView('learn');
})();
